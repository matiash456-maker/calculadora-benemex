<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Materiales</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="card">
    <h2>Calculadora de Materiales</h2>

    <!-- Selección de Producto -->
    <div class="form-group">
      <label for="producto">Producto:</label>
      <select id="producto"></select>
    </div>

    <!-- Modo de Entrada -->
    <div class="form-group">
      <label>Modo de ingreso:</label>
      <div class="tabs">
        <button id="btnM2" class="tab-btn active" onclick="cambiarModo('m2')">Por m² totales</button>
        <button id="btnMedidas" class="tab-btn" onclick="cambiarModo('medidas')">Por Medidas (Ancho x Alto)</button>
      </div>
    </div>

    <!-- Entradas de datos -->
    <div id="secM2" class="form-group">
      <label for="m2Input">Superficie total (m²):</label>
      <input type="number" id="m2Input" placeholder="Ej: 15" step="any">
    </div>

    <div id="secMedidas" class="form-group hidden">
      <div class="grid-2">
        <div>
          <label for="anchoInput">Ancho (m):</label>
          <input type="number" id="anchoInput" placeholder="Ej: 3" step="any">
        </div>
        <div>
          <label for="altoInput">Alto (m):</label>
          <input type="number" id="altoInput" placeholder="Ej: 5" step="any">
        </div>
      </div>
    </div>

    <!-- Campo Editable de Desperdicio -->
    <div class="form-group">
      <label for="desperdicioInput">Margen de desperdicio (%):</label>
      <input type="number" id="desperdicioInput" value="15" step="any">
    </div>

    <button class="btn-calcular" onclick="calcular()">Calcular Unidades</button>

    <!-- Resultado -->
    <div id="resultado" class="result-box hidden">
      <p id="resM2Nominal"></p>
      <p id="resM2ConMargen"></p>
      <h3 id="resUnidades"></h3>
    </div>

    <hr class="divider">

    <!-- Sección Administrar Productos -->
    <details class="admin-section">
      <summary>⚙️ Cargar / Gestionar Productos</summary>
      <div class="form-group admin-box">
        <h4>Agregar Nuevo Producto</h4>
        <label for="nuevoNombre">Nombre del producto:</label>
        <input type="text" id="nuevoNombre" placeholder="Ej: Wall Panel XL">

        <div class="grid-2">
          <div>
            <label for="nuevoAncho">Ancho (cm o m):</label>
            <input type="number" id="nuevoAncho" placeholder="Ej: 15 cm o 0.15" step="any">
          </div>
          <div>
            <label for="nuevoLargo">Largo/Alto (m):</label>
            <input type="number" id="nuevoLargo" placeholder="Ej: 2.90" step="any">
          </div>
        </div>
        <button class="btn-secundario" onclick="agregarProducto()">Guardar Producto</button>

        <h4 style="margin-top: 20px;">Productos Guardados</h4>
        <ul id="listaProductos" class="product-list"></ul>
      </div>
    </details>
  </div>

  <script src="app.js"></script>
</body>
</html>
