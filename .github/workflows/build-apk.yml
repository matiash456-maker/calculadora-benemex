name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configurar Java / JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Preparar proyecto Cordova y compilar
        run: |
          npm install -g cordova
          cordova create build_app com.benemex.calculadora "Calculadora Materiales"
          cd build_app
          rm -rf www/*
          cp -r ../index.html ../styles.css ../app.js ../manifest.json www/ 2>/dev/null || cp -r ../* www/ 2>/dev/null || true
          cordova platform add android
          cordova build android --debug

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: Calculadora-Materiales-APK
          path: build_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
