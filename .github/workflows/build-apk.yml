name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Configurar Java / JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Cordova y compilar APK
        run: |
          npm install -g cordova
          cordova create appcom.benemex.calculadora "Calculadora Materiales"
          cd app
          rm -rf www/*
          cp -r ../* www/ 2>/dev/null || true
          cordova platform add android
          cordova build android --debug

      - name: Guardar archivo APK
        uses: actions/upload-artifact@v3
        with:
          name: Calculadora-Materiales-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
